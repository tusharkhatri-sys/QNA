<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">
    <title>App Controller - QNA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen flex items-center justify-center p-4">
    <div class="bg-white border border-gray-300 w-full max-w-lg rounded-md shadow-2xl p-8 relative overflow-hidden">
        
        <!-- Header -->
        <div class="text-center mb-8 border-b border-gray-200 pb-6">
            <h2 id="form-title" class="text-2xl font-black tracking-tight text-gray-900 uppercase">Trainee Verification</h2>
            <p id="form-subtitle" class="text-sm font-medium text-gray-500 mt-2">Secure access restricted to authorized candidates</p>
        </div>
        
        <!-- LOGIN SECTION -->
        <div id="login-section" class="block">
            <div id="login-alert" class="hidden mb-6 p-3 rounded-md text-sm font-bold"></div>

            <form id="login-form" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Registered Email</label>
                    <input type="email" id="login-email" required class="w-full bg-gray-50 border border-gray-300 rounded-md p-3 text-gray-900 font-medium outline-none focus:border-blue-800 focus:ring-1 focus:ring-blue-800 transition-all" placeholder="Enter your registered email">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Security Password</label>
                    <input type="password" id="login-password" required class="w-full bg-gray-50 border border-gray-300 rounded-md p-3 text-gray-900 font-medium outline-none focus:border-blue-800 focus:ring-1 focus:ring-blue-800 transition-all" placeholder="Enter your password">
                </div>
                <button type="submit" id="login-btn" class="w-full bg-blue-800 hover:bg-blue-900 text-white font-bold py-3.5 rounded-md mt-8 transition-colors shadow-sm uppercase tracking-wider text-sm">
                    Authorize & Open Dashboard
                </button>
            </form>
            
            <div class="mt-4 text-center">
                <p class="text-xs font-medium text-gray-600">New Trainee? <a href="student-register.html" class="text-blue-700 font-bold hover:underline">Register Here</a></p>
            </div>
            
            <button class="w-full mt-4 text-xs font-bold text-red-600 hover:text-red-800 py-2" id="exit-app-btn" onclick="exitSafeBrowser()">
                Exit Safe Browser
            </button>
        </div>

    </div>

    <!-- Resend Activation Modal -->
    <div id="resend-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-md p-6 max-w-sm w-full text-center shadow-2xl">
            <div class="flex justify-center mb-4 text-amber-500">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                    <line x1="12" y1="9" x2="12" y2="13"></line>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
            </div>
            <h3 class="text-xl font-bold text-gray-900 mb-2">Email Not Verified</h3>
            <p class="text-sm text-gray-600 mb-6">It looks like you haven't confirmed your email address. Would you like us to send a new activation link to <strong id="resend-email-display" class="text-blue-700 break-all"></strong>?</p>
            <div class="flex flex-col gap-3">
                <button id="send-new-link-btn" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 rounded-md transition-colors shadow-sm uppercase tracking-wider text-sm">Send New Link</button>
                <button onclick="closeResendModal()" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 rounded-md transition-colors uppercase tracking-wider text-sm">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Supabase Core and Logic -->
    <script src="shared.js"></script>
    <script src="student-auth.js"></script>
</body>
</html>
