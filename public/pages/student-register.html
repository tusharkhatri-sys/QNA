<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">
    <title>New Trainee Registration - QNA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen flex items-center justify-center p-4">
    <div class="bg-white border border-gray-300 w-full max-w-lg rounded-md shadow-2xl p-8 relative overflow-hidden">
        
        <!-- Header -->
        <div class="text-center mb-8 border-b border-gray-200 pb-6">
            <h2 id="form-title" class="text-2xl font-black tracking-tight text-gray-900 uppercase">New Trainee Registration</h2>
            <p id="form-subtitle" class="text-sm font-medium text-gray-500 mt-2">Create your official credentials for the QNA platform</p>
        </div>
        
        <div id="register-alert" class="hidden mb-6 p-3 rounded-md text-sm font-bold"></div>

        <form id="register-form" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Full Name</label>
                <input type="text" id="reg-name" required class="w-full bg-gray-50 border border-gray-300 rounded-md p-2.5 text-gray-900 outline-none focus:border-blue-800 focus:ring-1 focus:ring-blue-800 transition-all" placeholder="Enter your full name">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Session</label>
                <select id="reg-session-select" required class="w-full bg-gray-50 border border-gray-300 rounded-md p-2.5 text-gray-900 font-medium outline-none focus:border-blue-800 focus:ring-1 focus:ring-blue-800 transition-all">
                    <option value="" disabled selected>Loading sessions...</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Trade</label>
                <select id="reg-trade" required class="w-full bg-gray-200 border border-gray-300 rounded-md p-2.5 text-gray-700 font-medium outline-none cursor-not-allowed" disabled>
                    <option value="COPA" selected>COPA (Computer Operator and Programming Assistant)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Date of Birth</label>
                <input type="date" id="reg-dob" required class="w-full bg-gray-50 border border-gray-300 rounded-md p-2.5 text-gray-900 outline-none focus:border-blue-800 focus:ring-1 focus:ring-blue-800 transition-all">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Email Address</label>
                <input type="email" id="reg-email" required class="w-full bg-gray-50 border border-gray-300 rounded-md p-2.5 text-gray-900 outline-none focus:border-blue-800 focus:ring-1 focus:ring-blue-800 transition-all" placeholder="Enter your email address">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Password (Min 8 characters)</label>
                <input type="password" id="reg-password" minlength="8" required class="w-full bg-gray-50 border border-gray-300 rounded-md p-2.5 text-gray-900 outline-none focus:border-blue-800 focus:ring-1 focus:ring-blue-800 transition-all" placeholder="Create a strong password">
            </div>
            <button type="submit" id="register-btn" class="w-full bg-blue-800 hover:bg-blue-900 text-white font-bold py-3.5 rounded-md mt-6 transition-colors shadow-sm">
                Complete Registration
            </button>
        </form>
    </div>

    <script src="shared.js"></script>
    <script src="student-register.js"></script>
</body>
</html>
