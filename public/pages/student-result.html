<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">
    <title>View Result - QNA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen flex items-center justify-center p-4">
    <div id="result-container" class="bg-white border border-gray-300 w-full max-w-2xl rounded-md shadow-2xl p-8 relative overflow-hidden">
        
        <!-- Header -->
        <div class="text-center mb-8 border-b border-gray-200 pb-6">
            <h2 class="text-2xl font-black tracking-tight text-gray-900 uppercase">Exam Marksheet</h2>
            <p class="text-sm font-medium text-gray-500 mt-2">Enter your credentials to view your latest published result</p>
        </div>
        
        <div id="result-alert" class="hidden mb-6 p-3 rounded-md text-sm font-bold"></div>

        <form id="result-form" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Email Address</label>
                <input type="email" id="res-email" required class="w-full bg-gray-50 border border-gray-300 rounded-md p-2.5 text-gray-900 outline-none focus:border-blue-800 focus:ring-1 focus:ring-blue-800 transition-all" placeholder="Enter your registered email">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Date of Birth</label>
                <input type="date" id="res-dob" required class="w-full bg-gray-50 border border-gray-300 rounded-md p-2.5 text-gray-900 outline-none focus:border-blue-800 focus:ring-1 focus:ring-blue-800 transition-all">
            </div>
            <button type="submit" id="view-result-btn" class="w-full bg-blue-800 hover:bg-blue-900 text-white font-bold py-3.5 rounded-md mt-6 transition-colors shadow-sm">
                View Result
            </button>
        </form>

        <!-- Marksheet Display (Hidden initially) -->
        <div id="marksheet-display" class="hidden mt-8">
            <!-- Marksheet Content will be injected here -->
        </div>

        <div class="mt-6 text-center">
            <a href="landing.html" class="text-sm font-bold text-blue-700 hover:text-blue-900 underline">Return to Home</a>
        </div>
    </div>

    <script src="shared.js"></script>
    <script src="student-result.js"></script>
</body>
</html>
