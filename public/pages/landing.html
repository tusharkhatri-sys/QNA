<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QNA Platform | Next-Gen Testing</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css?v=2">
    <style>
        body {
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            flex-direction: column;
        }
        .landing-title {
            font-size: 4rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 10px;
            letter-spacing: -1px;
            background: linear-gradient(135deg, var(--accent), #312e81);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }
        .landing-subtitle {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 60px;
            text-align: center;
            max-width: 600px;
        }
        .portal-grid {
            display: flex;
            gap: 30px;
            z-index: 10;
        }
        .portal-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 50px 40px;
            width: 320px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            color: inherit;
            position: relative;
            overflow: hidden;
        }
        .portal-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.05), transparent);
            opacity: 0;
            transition: var(--transition);
        }
        .portal-card:hover {
            transform: translateY(-10px);
            border-color: var(--accent);
            box-shadow: var(--shadow-glow);
        }
        .portal-card:hover::before {
            opacity: 1;
        }
        .portal-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            transition: var(--transition);
        }
        .portal-card:hover .portal-icon {
            transform: scale(1.1);
        }
        .portal-name {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .portal-desc {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.5;
        }
        #exit-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            display: none; /* hidden by default */
            width: 54px;
            height: 54px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
            transition: all 0.2s ease;
            align-items: center;
            justify-content: center;
        }
        #exit-btn:hover {
            background: #dc2626;
            transform: scale(1.08);
        }
    </style>
</head>
<body>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    <div class="bg-glow bg-glow-3"></div>

    <!-- Exit Button — only shown inside QNA Safe Browser -->
    <button id="exit-btn" title="Exit Safe Browser">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
    </button>

    <div style="z-index: 10; text-align: center;">
        <h1 class="landing-title">Welcome to QNA</h1>
        <p class="landing-subtitle">The next-generation assessment platform for seamless testing and powerful analytics.</p>
        
        <div class="portal-grid">
            <a href="auth.html" class="portal-card">
                <div class="portal-icon">🎓</div>
                <div class="portal-name">Student Portal</div>
                <div class="portal-desc">Login to join live assessments and review your past scores.</div>
            </a>
            
            <a href="admin-login.html" class="portal-card">
                <div class="portal-icon">🛡️</div>
                <div class="portal-name">Admin Console</div>
                <div class="portal-desc">Manage tests, monitor live students, and analyze data.</div>
            </a>
        </div>
    </div>

    <script>
        (function () {
            var SAFE_BROWSER_UA = 'QnaCopa-Safe-Browser-v1';
            var ua = navigator.userAgent || '';
            // For testing: Temporarily making it true so you can see the logout button in normal browser
            var isSafeBrowser = true; // ua.indexOf(SAFE_BROWSER_UA) !== -1;

            if (isSafeBrowser) {
                var exitBtn = document.getElementById('exit-btn');
                if (exitBtn) exitBtn.style.display = 'flex';

                exitBtn.addEventListener('click', function () {
                    if (confirm('Are you sure you want to exit QNA Safe Browser?')) {
                        // Use preload IPC bridge if available
                        if (window.qnaBrowser && typeof window.qnaBrowser.closeApp === 'function') {
                            window.qnaBrowser.closeApp();
                        } else {
                            // Fallback
                            try {
                                const { ipcRenderer } = require('electron');
                                ipcRenderer.send('exit-app');
                            } catch (e) {
                                window.close();
                            }
                        }
                    }
                });
            }
        })();
    </script>
</body>
</html>
