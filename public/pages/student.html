<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard | QNA Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css?v=2">
    <style>
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
        }
        .profile-badge {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(15, 23, 42, 0.05);
            padding: 8px 16px 8px 8px;
            border-radius: 100px;
            border: 1px solid var(--border);
        }
        .profile-avatar {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, var(--accent), #e5c158);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            color: #ffffff;
        }
        .dashboard-container {
            margin-top: 100px;
            padding: 40px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            z-index: 10;
            position: relative;
        }
        .panel-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            padding: 40px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-glow);
        }
    </style>
</head>
<body class="bg-[#0f172a] text-white min-h-screen font-sans selection:bg-blue-500/30 overflow-x-hidden relative">

    <!-- Global Background Elements -->
    <div class="fixed inset-0 pointer-events-none z-0">
        <!-- Glows -->
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-blue-600/10 blur-[120px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-purple-600/10 blur-[120px]"></div>
        <!-- Grid -->
        <div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGRlZnM+PHBhdHRlcm4gaWQ9ImdyaWQiIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCIgcGF0dGVyblVuaXRzPSJ1c2VyU3BhY2VPblVzZSI+PHBhdHRlcm4gaWQ9InNtYWxsR3JpZCIgd2lkdGg9IjEwIiBoZWlnaHQ9IjEwIiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNMTAgMEwwIDBMMCAxMCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSJyZ2JhKDI1NSwyNTUsMjU1LDAuMDMpIiBzdHJva2Utd2lkdGg9IjEiLz48L3BhdHRlcm4+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjQwIiBmaWxsPSJ1cmwoI3NtYWxsR3JpZCkiLz48cGF0aCBkPSJNNDAgMEwwIDBMMCA0MCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSJyZ2JhKDI1NSwyNTUsMjU1LDAuMDcpIiBzdHJva2Utd2lkdGg9IjEiLz48L3BhdHRlcm4+PC9kZWZzPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9InVybCgjZ3JpZCkiLz48L3N2Zz4=')] opacity-50"></div>
    </div>

    <!-- Header -->
    <header class="glass-nav fixed top-0 w-full z-50 border-b border-white/5">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-500 to-purple-500 flex items-center justify-center font-black text-xl shadow-[0_0_20px_rgba(59,130,246,0.3)] border border-white/20 relative overflow-hidden group">
                    <div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
                    <span class="relative z-10 tracking-tighter">Q</span>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">QNA Portal</h1>
                    <p class="text-[10px] text-blue-400 font-medium tracking-widest uppercase">Student Access</p>
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="hidden sm:flex items-center gap-2 px-4 py-2 rounded-full bg-white/5 border border-white/5 text-sm backdrop-blur-md">
                    <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse shadow-[0_0_10px_rgba(34,197,94,0.5)]"></div>
                    <span id="header-student-name" class="font-medium">Loading...</span>
                </div>
                <button onclick="exitSafeBrowser()" class="px-4 py-2 rounded-lg bg-red-500/10 text-red-400 hover:bg-red-500 hover:text-white transition-all text-sm font-bold border border-red-500/20 hover:shadow-[0_0_15px_rgba(239,68,68,0.4)]">
                    Exit App
                </button>
            </div>
        </div>
    </header>

    <div class="dashboard-container">
        <!-- Live Test Panel -->
        <div class="panel-card">
            <div style="font-size: 3rem; margin-bottom: 20px;">⚡</div>
            <h2 style="font-size: 2rem; margin-bottom: 10px;">Join Live Test</h2>
            <p style="color: var(--text-muted); margin-bottom: 30px; line-height: 1.6;">Enter the secure 6-character access code provided by your instructor to begin your live assessment.</p>
            
            <div id="join-error-msg" style="color: var(--red); background: var(--red-bg); padding: 12px; border-radius: var(--radius-sm); margin-bottom: 20px; display: none;"></div>
            
            <div class="form-group">
                <label>Confirm Name</label>
                <input type="text" id="student-name-input" class="modern-input" readonly style="opacity: 0.7; cursor: not-allowed;">
            </div>
            <div class="form-group">
                <label>Access Code</label>
                <input type="text" id="test-code-input" class="modern-input" placeholder="e.g. A1B2C3" style="text-transform: uppercase; letter-spacing: 4px; font-family: 'JetBrains Mono', monospace; font-size: 1.2rem; font-weight: 700;">
            </div>
            
            <button class="btn btn-primary" style="width: 100%; margin-top: 10px;" onclick="joinLiveTest()">Connect to Test</button>
        </div>

        <!-- Practice Panel -->
        <div class="panel-card" style="display: flex; flex-direction: column; justify-content: center;">
            <div style="font-size: 3rem; margin-bottom: 20px;">🧠</div>
            <h2 style="font-size: 2rem; margin-bottom: 10px;">Offline Practice</h2>
            <p style="color: var(--text-muted); margin-bottom: 30px; line-height: 1.6;">Sharpen your skills with our massive database of 1000+ curated COPA questions.</p>
            
            <div style="display: grid; gap: 16px;">
                <button class="btn btn-secondary" onclick="startLocalPractice('mock')">Full Mock Exam (50 Qs)</button>
                <button class="btn btn-secondary" onclick="startLocalPractice('topic')">Topic-wise Practice</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../questions.js"></script>
    <script src="shared.js"></script>
    <script src="student.js"></script>
</body>
</html>
