<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard | QNA Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css?v=2">
    <style>
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
        }
        .profile-badge {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(15, 23, 42, 0.05);
            padding: 8px 16px 8px 8px;
            border-radius: 100px;
            border: 1px solid var(--border);
        }
        .profile-avatar {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, var(--accent), #e5c158);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            color: #ffffff;
        }
        .dashboard-container {
            margin-top: 100px;
            padding: 40px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            z-index: 10;
            position: relative;
        }
        .panel-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            padding: 40px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-glow);
        }
    </style>
</head>
<body>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <nav class="top-nav">
        <div style="font-size: 1.5rem; font-weight: 800; letter-spacing: 1px; color: var(--accent);">QNA Student</div>
        <div style="display: flex; gap: 20px; align-items: center;">
            <div class="profile-badge">
                <div class="profile-avatar" id="badge-initial">S</div>
                <span id="badge-name" style="font-weight: 500; font-size: 0.9rem;">Student</span>
            </div>
            <button class="btn btn-outline" style="padding: 10px 20px; font-size: 0.9rem;" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="dashboard-container">
        <!-- Live Test Panel -->
        <div class="panel-card">
            <div style="font-size: 3rem; margin-bottom: 20px;">⚡</div>
            <h2 style="font-size: 2rem; margin-bottom: 10px;">Join Live Test</h2>
            <p style="color: var(--text-muted); margin-bottom: 30px; line-height: 1.6;">Enter the secure 6-character access code provided by your instructor to begin your live assessment.</p>
            
            <div id="join-error-msg" style="color: var(--red); background: var(--red-bg); padding: 12px; border-radius: var(--radius-sm); margin-bottom: 20px; display: none;"></div>
            
            <div class="form-group">
                <label>Confirm Name</label>
                <input type="text" id="student-name-input" class="modern-input" readonly style="opacity: 0.7; cursor: not-allowed;">
            </div>
            <div class="form-group">
                <label>Access Code</label>
                <input type="text" id="test-code-input" class="modern-input" placeholder="e.g. A1B2C3" style="text-transform: uppercase; letter-spacing: 4px; font-family: 'JetBrains Mono', monospace; font-size: 1.2rem; font-weight: 700;">
            </div>
            
            <button class="btn btn-primary" style="width: 100%; margin-top: 10px;" onclick="joinLiveTest()">Connect to Test</button>
        </div>

        <!-- Practice Panel -->
        <div class="panel-card" style="display: flex; flex-direction: column; justify-content: center;">
            <div style="font-size: 3rem; margin-bottom: 20px;">🧠</div>
            <h2 style="font-size: 2rem; margin-bottom: 10px;">Offline Practice</h2>
            <p style="color: var(--text-muted); margin-bottom: 30px; line-height: 1.6;">Sharpen your skills with our massive database of 1000+ curated COPA questions.</p>
            
            <div style="display: grid; gap: 16px;">
                <button class="btn btn-secondary" onclick="startLocalPractice('mock')">Full Mock Exam (50 Qs)</button>
                <button class="btn btn-secondary" onclick="startLocalPractice('topic')">Topic-wise Practice</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../questions.js"></script>
    <script src="shared.js"></script>
    <script src="student.js"></script>
</body>
</html>
