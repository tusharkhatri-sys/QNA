<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Live Assessment | QNA Platform</title>
    <link rel="stylesheet" href="../style.css?v=4">
    <style>
        /* Mobile WebView Anti-Zoom & Anti-Pinch */
        body { touch-action: pan-y; }
    </style>
</head>
<body oncontextmenu="return false" oncopy="return false" oncut="return false" onpaste="return false">
    <!-- KIOSK KEYBOARD LOCKS -->
    <script>
        document.addEventListener('keydown', function(e) {
            // Block F5, Ctrl+R, F12, Ctrl+C, Ctrl+V, Alt+Left
            if (e.key === 'F5' || (e.ctrlKey && e.key === 'r') || e.key === 'F12' || (e.altKey && e.key === 'ArrowLeft')) {
                e.preventDefault();
            }
        });
    </script>
    <div id="quiz-screen" class="exam-layout">
        <!-- Header -->
        <header class="exam-header">
            <div>
                <h2 id="quiz-topic-name" class="font-bold text-lg">Loading Assessment...</h2>
                <div class="text-sm mt-10" style="color: var(--text-secondary);">Candidate: <span id="candidate-name" class="font-bold" style="color: var(--text-primary);"></span></div>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <div id="quiz-timer" class="font-bold text-xl">⏱️ 00:00</div>
                <button id="end-practice-btn" class="btn btn-danger" style="display: none;" onclick="confirmEarlySubmit()">End Practice</button>
            </div>
        </header>

        <!-- Main Question Area -->
        <div class="exam-question-area">
            <div class="font-bold text-lg mb-10" style="border-bottom: 2px solid var(--border-light); padding-bottom: 10px;">
                Question <span id="current-q-num">1</span> of <span id="total-q-num">50</span>
            </div>
            
            <div id="question-text" class="text-lg font-bold mb-10">Loading question text...</div>
            <div id="question-text-hi" class="text-sm mb-10 text-secondary" style="margin-bottom: 30px;"></div>
            
            <div id="options-grid" class="mt-10" style="display: flex; flex-direction: column;">
                <!-- Options injected by JS -->
            </div>
        </div>

        <!-- Palette Area -->
        <div class="exam-palette-area">
            <div class="font-bold text-sm text-center mb-10" style="border-bottom: 2px solid var(--border-light); padding-bottom: 10px;">Question Palette</div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px; font-size: 11px; margin-bottom: 15px;">
                <div class="flex align-center"><span style="display:inline-block; width:12px; height:12px; background:var(--color-answered); margin-right:5px; border:1px solid #16A34A;"></span> Answered</div>
                <div class="flex align-center"><span style="display:inline-block; width:12px; height:12px; background:var(--color-not-answered); margin-right:5px; border:1px solid #DC2626;"></span> Not Answered</div>
                <div class="flex align-center"><span style="display:inline-block; width:12px; height:12px; background:var(--color-not-visited); margin-right:5px; border:1px solid var(--border-color);"></span> Not Visited</div>
                <div class="flex align-center"><span style="display:inline-block; width:12px; height:12px; background:var(--color-marked); margin-right:5px; border:1px solid #9333EA;"></span> Marked</div>
            </div>
            
            <div id="palette-grid" class="palette-grid">
                <!-- Buttons injected by JS -->
            </div>
        </div>
        
        <!-- Footer / Action Bar -->
        <div class="exam-footer">
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-warning" id="mark-btn" onclick="toggleMarkForReview()">Mark for Review & Next</button>
                <button class="btn" id="clear-btn" onclick="clearResponse()">Clear Response</button>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn" id="prev-btn" onclick="prevQuestion()" disabled>← Previous</button>
                <button class="btn btn-primary" id="next-btn" onclick="nextQuestion()">Save & Next →</button>
                <button class="btn btn-success" id="submit-btn" style="display: none;" onclick="triggerSubmitConfirmation()">Submit Test</button>
            </div>
        </div>

        <!-- Custom Non-Blocking Modal (White Government Theme) -->
        <div id="custom-modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(17, 24, 39, 0.7); z-index: 9999; justify-content: center; align-items: center; backdrop-filter: blur(4px);">
            <div style="background: #ffffff; padding: 32px; border-radius: 6px; border: 1px solid #E5E7EB; max-width: 420px; width: 90%; text-align: center; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);">
                <div id="modal-icon" style="margin-bottom: 16px;"></div>
                <h3 id="custom-modal-title" class="font-black text-gray-900 text-xl mb-4 tracking-tight uppercase">Alert</h3>
                <p id="custom-modal-message" class="text-gray-700 text-sm font-medium mb-6 leading-relaxed"></p>
                <div id="custom-modal-timer" class="hidden text-red-600 font-bold text-lg mb-6"></div>
                <div style="display: flex; gap: 12px; justify-content: center;">
                    <button id="custom-modal-cancel" class="bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-2.5 px-6 rounded-md border border-gray-300 transition-colors" style="display: none;">Cancel</button>
                    <button id="custom-modal-confirm" class="bg-blue-800 hover:bg-blue-900 text-white font-bold py-2.5 px-6 rounded-md shadow-sm transition-colors">Acknowledge</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../questions.js"></script>
    <script src="shared.js"></script>
    <script src="quiz.js"></script>
</body>
</html>
