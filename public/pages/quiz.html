<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Assessment | QNA Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css?v=2">
    <style>
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
        }
        .quiz-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .quiz-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 40px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-glow);
            position: relative;
        }
        .timer-badge {
            background: rgba(15, 23, 42, 0.05);
            padding: 10px 20px;
            border-radius: 100px;
            border: 1px solid var(--border);
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .question-number {
            color: var(--accent);
            font-weight: 700;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        .question-text {
            font-size: 1.6rem;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 10px;
        }
        .question-text-hi {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 40px;
        }
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 40px;
        }
        .option-card {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px 24px;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
        }
        .option-card:hover {
            background: #ffffff;
            border-color: var(--accent-light);
            transform: translateX(4px);
            box-shadow: var(--shadow-glow);
        }
        .option-card.selected {
            background: var(--accent-glow);
            border-color: var(--accent);
        }
        .option-card.selected .option-letter {
            background: var(--accent);
            color: #000;
        }
        .option-letter {
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(15, 23, 42, 0.05);
            border-radius: 8px;
            font-weight: 700;
            font-size: 1.1rem;
            transition: var(--transition);
        }
        .option-text {
            font-size: 1.1rem;
            font-weight: 500;
        }
        .quiz-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 30px;
            border-top: 1px solid var(--border);
        }
    </style>
</head>
<body>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-3"></div>

    <div id="quiz-screen">
        <header class="quiz-topbar">
            <div>
                <h2 id="quiz-topic-name" style="font-size: 1.4rem; font-weight: 700;">Loading Assessment...</h2>
            </div>
            <div id="quiz-timer" class="timer-badge">⏱️ 00:00</div>
        </header>

        <div class="quiz-container">
            <div class="question-number">Question <span id="current-q-num">1</span> of <span id="total-q-num">50</span></div>
            
            <div id="question-text" class="question-text">Loading question text...</div>
            <div id="question-text-hi" class="question-text-hi"></div>
            
            <div id="options-grid" class="options-grid">
                <!-- Options injected by JS -->
            </div>
            
            <div class="quiz-footer">
                <button class="btn btn-outline" id="prev-btn" onclick="prevQuestion()" disabled>← Previous</button>
                <button class="btn btn-primary" id="next-btn" onclick="nextQuestion()">Next →</button>
                <button class="btn btn-primary" id="submit-btn" style="display: none; background: linear-gradient(135deg, var(--green), #059669); box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);" onclick="submitQuiz()">Submit Assessment</button>
            </div>
        </div>
    </div>

    <script src="shared.js"></script>
    <script src="quiz.js"></script>
</body>
</html>
