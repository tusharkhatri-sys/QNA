name: Build Android APK

on:
  push:
    branches: [ "main" ]
    paths:
      - 'lockdown-mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Install dependencies
      working-directory: ./lockdown-mobile
      run: npm install

    - name: Capacitor Sync
      working-directory: ./lockdown-mobile
      run: npx cap sync android

    - name: Build APK
      working-directory: ./lockdown-mobile/android
      run: |
        chmod +x ./gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: qna-safe-browser-apk
        path: lockdown-mobile/android/app/build/outputs/apk/debug/app-debug.apk
